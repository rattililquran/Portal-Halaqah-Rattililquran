<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cek Sesi — Diagnostik</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; background:#0f172a; color:#e2e8f0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color:#94a3b8; font-size: 13px; }
  .card { background:#1e293b; border-radius:12px; padding:16px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #334155; }
  .row:last-child { border-bottom:none; }
  .label { color:#cbd5e1; font-size:14px; }
  .val { font-weight:700; font-size:14px; padding:3px 10px; border-radius:20px; }
  .ok  { background:#065f46; color:#6ee7b7; }
  .bad { background:#7f1d1d; color:#fca5a5; }
  .neutral { background:#334155; color:#cbd5e1; }
  #verdict { font-size:15px; line-height:1.5; }
  pre { background:#0b1220; padding:10px; border-radius:8px; overflow-x:auto; font-size:11px; color:#93c5fd; }
  button { width:100%; padding:12px; margin-top:8px; border:none; border-radius:10px; font-size:14px; font-weight:600; }
  .btn-clear { background:#b45309; color:#fff; }
  .btn-reload { background:#1d4ed8; color:#fff; }
</style>
</head>
<body>
  <h1>🔍 Diagnostik Sesi Login</h1>
  <p class="sub">Buka halaman ini di HP yang bermasalah, lalu foto hasilnya.</p>

  <div class="card">
    <div class="row"><span class="label">Sesi Supabase (auth.uid)</span><span id="s-session" class="val neutral">…</span></div>
    <div class="row"><span class="label">Cache aplikasi (hq_user)</span><span id="s-user" class="val neutral">…</span></div>
    <div class="row"><span class="label">Token cadangan (hq_token)</span><span id="s-token" class="val neutral">…</span></div>
    <div class="row"><span class="label">Mode PWA (standalone)</span><span id="s-pwa" class="val neutral">…</span></div>
  </div>

  <div class="card">
    <div id="verdict">Memeriksa…</div>
  </div>

  <div class="card">
    <div class="label" style="margin-bottom:6px;">Detail teknis</div>
    <pre id="detail">…</pre>
  </div>

  <button class="btn-clear" onclick="bersihkan()">🧹 Bersihkan sesi &amp; login ulang</button>
  <button class="btn-reload" onclick="location.reload()">🔄 Periksa ulang</button>

<script src="../assets/js/supabase.min.js"></script>
<script>
  const SUPABASE_URL  = 'https://zefriybfrirrtsulogta.supabase.co';
  const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InplZnJpeWJmcmlycnRzdWxvZ3RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNTk1MzIsImV4cCI6MjA5NTkzNTUzMn0.AmB43YG-fCYqATdh5BrfLJmGITI_UeX8csOYyjd9i_U';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

  function set(id, ada, textOk, textBad) {
    var el = document.getElementById(id);
    el.textContent = ada ? (textOk || 'ADA') : (textBad || 'TIDAK ADA');
    el.className = 'val ' + (ada ? 'ok' : 'bad');
  }

  async function jalankan() {
    var detail = {};
    // 1. Sesi Supabase asli
    var sessRes = await sb.auth.getSession();
    var session = sessRes.data && sessRes.data.session;
    set('s-session', !!session);
    detail.punya_sesi = !!session;

    // 2. Cache aplikasi
    var hqUser = localStorage.getItem('hq_user') || sessionStorage.getItem('hq_user');
    var parsed = null; try { parsed = hqUser ? JSON.parse(hqUser) : null; } catch(e){}
    set('s-user', !!hqUser);
    detail.hq_user = parsed ? { id_user: parsed.id_user, role: parsed.role, nama: parsed.nama || parsed.nama_lengkap } : null;

    // 3. Token cadangan
    var hqToken = localStorage.getItem('hq_token');
    set('s-token', !!hqToken);

    // 4. PWA standalone?
    var pwa = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    var el = document.getElementById('s-pwa');
    el.textContent = pwa ? 'YA (terpasang)' : 'Tidak (browser)';
    el.className = 'val ' + (pwa ? 'neutral' : 'neutral');
    detail.pwa_standalone = pwa;

    // 5. Uji nyata ke DB: siapa saya menurut server?
    if (session) {
      var uidRes = await sb.rpc('current_user_id').catch(function(){ return { error:'rpc tidak tersedia' }; });
      detail.server_user_id = uidRes && uidRes.data;
      detail.auth_uid = session.user && session.user.id;
      detail.token_exp = new Date(session.expires_at * 1000).toLocaleString('id-ID');
    }

    document.getElementById('detail').textContent = JSON.stringify(detail, null, 2);

    // Vonis
    var v = document.getElementById('verdict');
    if (!session && hqUser) {
      v.innerHTML = '<b style="color:#fca5a5;">✅ PENYEBAB TERKONFIRMASI.</b><br>' +
        'Sesi Supabase HILANG tapi aplikasi masih mengira Anda login. ' +
        'Inilah kenapa muncul error <i>row-level security</i> saat buka KBM. ' +
        'Klik tombol oranye di bawah untuk bersihkan &amp; login ulang.';
    } else if (session && hqUser) {
      v.innerHTML = '<b style="color:#6ee7b7;">Sesi sehat.</b><br>' +
        'Sesi Supabase dan cache aplikasi keduanya ada. Kalau error masih muncul, ' +
        'kemungkinan role akun bukan guru atau id_guru tidak cocok — kirim blok "Detail teknis" di atas.';
    } else if (session && !hqUser) {
      v.innerHTML = 'Sesi Supabase ada, tapi cache aplikasi kosong. Coba buka portal guru seperti biasa.';
    } else {
      v.innerHTML = 'Keduanya kosong — memang belum login. Silakan login dulu, lalu bila error muncul buka lagi halaman ini.';
    }
  }

  function bersihkan() {
    try {
      sb.auth.signOut();
      localStorage.removeItem('hq_user'); sessionStorage.removeItem('hq_user');
      localStorage.removeItem('hq_token'); localStorage.removeItem('hq_refresh');
      // buang juga key sesi milik supabase
      Object.keys(localStorage).forEach(function(k){ if (k.indexOf('sb-') === 0) localStorage.removeItem(k); });
    } catch(e){}
    alert('Sesi dibersihkan. Anda akan diarahkan ke halaman login.');
    location.href = '../index.html';
  }

  jalankan().catch(function(e){
    document.getElementById('verdict').textContent = 'Gagal memeriksa: ' + e.message;
  });
</script>
</body>
</html>
